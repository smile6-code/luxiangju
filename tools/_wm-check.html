<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>填充是否生效</title>
<style>body{margin:0}pre{padding:10px;background:#000;color:#9f9;font:12px/1.5 Consolas,monospace;white-space:pre-wrap;margin:0}</style>
</head>
<body>
<pre id="out">检查中…</pre>
<script>
const NAME = '九转大肠', ID = 'dish-jiuzhuandachang';
const W = 448, H = 336;
const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d', { willReadFrequently: true });
const load = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
const lumArr = (img) => {
  ctx.clearRect(0, 0, W, H); ctx.drawImage(img, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  const a = new Float32Array(W * H);
  for (let i = 0, p = 0; i < d.length; i += 4, p++)
    a[p] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
  return a;
};
(async () => {
  const a = await load('../../' + encodeURIComponent(NAME) + '.png');
  const b = await load('../assets/img/photos/' + ID + '.jpg');
  const L = [];
  if (!a || !b) { document.getElementById('out').textContent = '有图没加载上: a=' + !!a + ' b=' + !!b; return; }
  const A = lumArr(a), B = lumArr(b);

  // 水印矩形在原图中的相对位置
  const rx0 = 0.8398, ry0 = 0.8705, rw = 0.1507, rh = 0.1205;
  let inSum = 0, inN = 0, outSum = 0, outN = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const fx = x / W, fy = y / H;
    const inside = fx >= rx0 && fx < rx0 + rw && fy >= ry0 && fy < ry0 + rh;
    const d = Math.abs(A[y * W + x] - B[y * W + x]);
    if (inside) { inSum += d; inN++; } else { outSum += d; outN++; }
  }
  L.push('平均绝对差(0=完全没改)');
  L.push('  水印矩形内 : ' + (inSum / inN).toFixed(5));
  L.push('  矩形外     : ' + (outSum / outN).toFixed(5));
  L.push('');
  // 打印矩形内一行剖面
  const yProbe = Math.floor((ry0 + rh / 2) * H);
  const row = [];
  for (let x = Math.floor(rx0 * W); x < Math.floor((rx0 + rw) * W); x += 2) {
    row.push(A[yProbe * W + x].toFixed(2) + '→' + B[yProbe * W + x].toFixed(2));
  }
  L.push('矩形中线亮度剖面 (原→处理):');
  L.push('  ' + row.join(' '));
  document.getElementById('out').textContent = L.join('\n');
})();
</script>
</body>
</html>
