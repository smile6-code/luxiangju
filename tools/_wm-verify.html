<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>去水印前后对比</title>
<style>body{margin:0}pre{padding:10px;background:#000;color:#9f9;font:11px/1.2 Consolas,monospace;white-space:pre;margin:0}</style>
</head>
<body>
<pre id="out">分析中…</pre>
<script>
const IDS = ['dish-jiuzhuandachang','dish-congshaohaishen','dish-baochaoyaohua','dish-dezhoubaji',
             'dish-bazirou','dish-sixiwanzi','dish-tangculiyu','dish-youmendaxia','dish-naitangpucai',
             'dish-wuxiangxunyu','dish-jiangniurou','dish-shandongjianbing','dish-basishanyao'];
const CN = {'dish-jiuzhuandachang':'九转大肠','dish-congshaohaishen':'葱烧海参','dish-baochaoyaohua':'爆炒腰花',
            'dish-dezhoubaji':'德州扒鸡','dish-bazirou':'把子肉','dish-sixiwanzi':'四喜丸子',
            'dish-tangculiyu':'糖醋黄河鲤鱼','dish-youmendaxia':'油闷大虾','dish-naitangpucai':'奶汤蒲菜',
            'dish-wuxiangxunyu':'五香熏鱼','dish-jiangniurou':'鲁味酱牛肉','dish-shandongjianbing':'山东大煎饼',
            'dish-basishanyao':'拔丝山药'};
const W = 448, H = 336;
const cv = document.createElement('canvas');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d', { willReadFrequently: true });

const load = (src) => new Promise((r) => {
  const i = new Image();
  i.onload = () => r(i); i.onerror = () => r(null); i.src = src;
});

async function medianGradient(mkSrc) {
  const list = [];
  for (const id of IDS) {
    const img = await load(mkSrc(id));
    if (!img) continue;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);
    const d = ctx.getImageData(0, 0, W, H).data;
    const lum = new Float32Array(W * H);
    for (let i = 0, p = 0; i < d.length; i += 4, p++)
      lum[p] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
    const g = new Float32Array(W * H);
    for (let y = 1; y < H - 1; y++)
      for (let x = 1; x < W - 1; x++) {
        const p = y * W + x;
        const gx = lum[p + 1] - lum[p - 1], gy = lum[p + W] - lum[p - W];
        g[p] = Math.sqrt(gx * gx + gy * gy);
      }
    list.push(g);
  }
  const N = list.length, med = new Float32Array(W * H), t = new Float64Array(N);
  for (let p = 0; p < W * H; p++) {
    for (let k = 0; k < N; k++) t[k] = list[k][p];
    t.sort(); med[p] = N % 2 ? t[(N - 1) / 2] : (t[N / 2 - 1] + t[N / 2]) / 2;
  }
  return { med, N };
}

function regionStats(med, rx0, ry0, rx1, ry1) {
  let mx = 0, sum = 0, n = 0;
  for (let y = Math.floor(ry0 * H); y < Math.floor(ry1 * H); y++)
    for (let x = Math.floor(rx0 * W); x < Math.floor(rx1 * W); x++) {
      const v = med[y * W + x]; if (v > mx) mx = v; sum += v; n++;
    }
  return { max: mx, avg: sum / n };
}

function regionMap(med, mx, rx0, ry0, rx1, ry1) {
  const ramp = ' .:-=+*#%@';
  const cw = 4, ch = 4;
  const x0 = Math.floor(rx0 * W), x1 = Math.floor(rx1 * W);
  const y0 = Math.floor(ry0 * H), y1 = Math.floor(ry1 * H);
  const out = [];
  for (let y = y0; y < y1; y += ch) {
    let line = '';
    for (let x = x0; x < x1; x += cw) line += ramp[Math.min(9, Math.round((med[y * W + x] / mx) * 9))];
    out.push(line);
  }
  return out;
}

(async () => {
  const before = await medianGradient((id) => '../../' + encodeURIComponent(CN[id]) + '.png');
  const after = await medianGradient((id) => '../assets/img/photos/' + id + '.jpg');
  const RX0 = 0.83, RY0 = 0.86, RX1 = 1.0, RY1 = 1.0;
  const sb = regionStats(before.med, RX0, RY0, RX1, RY1);
  const sa = regionStats(after.med, RX0, RY0, RX1, RY1);

  const L = [];
  L.push('图数 前 ' + before.N + ' / 后 ' + after.N + '   区域 x' + RX0 + '-' + RX1 + ' y' + RY0 + '-' + RY1);
  L.push('');
  L.push('处理前  该区峰值梯度 ' + sb.max.toFixed(4) + '   均值 ' + sb.avg.toFixed(4));
  L.push('处理后  该区峰值梯度 ' + sa.max.toFixed(4) + '   均值 ' + sa.avg.toFixed(4));
  L.push('峰值下降 ' + (((sb.max - sa.max) / sb.max) * 100).toFixed(1) + '%   均值下降 ' +
         (((sb.avg - sa.avg) / sb.avg) * 100).toFixed(1) + '%');
  L.push('');
  L.push('=== 处理前 ===');
  regionMap(before.med, sb.max, RX0, RY0, RX1, RY1).forEach((r, i) => L.push(r));
  L.push('');
  L.push('=== 处理后(应当变干净) ===');
  regionMap(after.med, sb.max, RX0, RY0, RX1, RY1).forEach((r) => L.push(r));
  document.getElementById('out').textContent = L.join('\n');
})();
</script>
</body>
</html>
