<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>responsive check</title>
<style>
  body{margin:0;font:11px/1.45 Consolas,monospace;background:#111;color:#ccc}
  iframe{border:0;display:block;background:#000}
  pre{padding:12px;white-space:pre-wrap;background:#000;color:#8f8;margin:0}
</style>
</head>
<body>
<pre id="out">working…</pre>
<iframe id="f" src="../index.html"></iframe>
<script>
const W = Number(new URLSearchParams(location.search).get('w') || 1440);
const H = Number(new URLSearchParams(location.search).get('h') || 900);
const f = document.getElementById('f');
const out = document.getElementById('out');
f.style.width = W + 'px';
f.style.height = H + 'px';

const errs = [];
f.addEventListener('load', () => {
  const w = f.contentWindow, d = f.contentDocument;
  w.addEventListener('error', (e) => errs.push(String(e.message)));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  setTimeout(async () => {
    const de = d.documentElement;
    const L = [];
    L.push('viewport        ' + W + ' x ' + H);
    L.push('overflow-x      ' + (de.scrollWidth - de.clientWidth) + 'px');
    L.push('doc height      ' + de.scrollHeight);

    const imgs = Array.from(d.images);
    L.push('images          ' + imgs.length + ' broken=' + imgs.filter((i) => !i.complete || i.naturalWidth === 0).length);

    const vis = (sel) => {
      const el = d.querySelector(sel);
      if (!el) return 'null';
      const s = w.getComputedStyle(el);
      return el.getBoundingClientRect().width > 0 && s.display !== 'none' && s.visibility !== 'hidden';
    };
    L.push('navToggle shown ' + vis('.nav-toggle'));
    L.push('nav list shown  ' + vis('.nav__list'));
    L.push('header phone    ' + vis('.header__phone'));

    const dishes = Array.from(d.querySelectorAll('.dish'));
    const cols = [...new Set(dishes.map((el) => Math.round(el.getBoundingClientRect().left)))].length;
    const cw = Math.round(dishes[0].getBoundingClientRect().width);
    L.push('dish columns    ' + cols + '  cardW=' + cw);

    const g = d.querySelector('.gallery__grid');
    L.push('gallery cols    ' + w.getComputedStyle(g).gridTemplateColumns.split(' ').length);

    const bi = d.querySelector('.booking__inner');
    L.push('booking cols    ' + w.getComputedStyle(bi).gridTemplateColumns.split(' ').length);

    const ai = d.querySelector('.about__inner');
    L.push('about cols      ' + w.getComputedStyle(ai).gridTemplateColumns.split(' ').length);

    const tabs = d.querySelector('.menu__tabs');
    const tr = tabs.getBoundingClientRect();
    L.push('tabs box        w=' + Math.round(tr.width) + ' h=' + Math.round(tr.height));

    const wide = Array.from(d.querySelectorAll('*')).filter((el) => {
      const r = el.getBoundingClientRect();
      if (r.width <= 0) return false;
      const s = w.getComputedStyle(el);
      if (s.position === 'absolute' || s.position === 'fixed') return false;
      return r.right > de.clientWidth + 2 || r.left < -2;
    }).slice(0, 10).map((el) => el.tagName.toLowerCase() + '.' + String(el.className || '').split(' ')[0]);
    L.push('overflowing     ' + (wide.length ? wide.join(', ') : 'none'));
    L.push('');

    // 打开菜品详情弹窗,量一下面板是否会溢出视口
    const hit = d.querySelector('.dish__hit');
    if (hit) {
      hit.click();
      await wait(600);
      const panel = d.querySelector('.dish-dialog__panel');
      const pr = panel.getBoundingClientRect();
      const fits = pr.right <= W + 1 && pr.left >= -1 && pr.top >= -1 && pr.bottom <= H + 1;
      L.push('dialog open     ' + d.getElementById('dishDialog').open);
      L.push('dialog title    ' + d.getElementById('dishDialogTitle').textContent.trim());
      L.push('dialog panel    x=' + Math.round(pr.x) + ' y=' + Math.round(pr.y) +
        ' w=' + Math.round(pr.width) + ' h=' + Math.round(pr.height) + '  fits=' + fits);
      const db = d.querySelector('.dish-dialog__body');
      L.push('dialog body     scrollH=' + db.scrollHeight + ' clientH=' + db.clientHeight +
        ' 可滚动=' + (db.scrollHeight > db.clientHeight + 1));
      L.push('dialog 主料/配菜 ' +
        Array.from(d.getElementById('dishDialogDetail').querySelectorAll('.detail-group h4')).map((h) => h.textContent).join(' · '));
      d.getElementById('dishDialogClose').click();
      await wait(200);
      L.push('关闭后 body 锁  ' + d.body.classList.contains('is-locked'));
    }
    L.push('errors          ' + (errs.length ? errs.join(' | ') : 'none'));
    out.textContent = L.join('\n');
  }, 2200);
});
</script>
</body>
</html>
