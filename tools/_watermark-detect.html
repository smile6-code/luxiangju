<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>水印定位</title>
<style>body{margin:0}pre{padding:10px;background:#000;color:#9f9;font:11px/1.2 Consolas,monospace;white-space:pre;margin:0}</style>
</head>
<body>
<pre id="out">分析中…</pre>
<script>
/* 思路:逐图求梯度,再逐像素取中位数。
   画面内容是随机的 -> 中位数被压平;水印位置固定 -> 梯度稳定留存。 */
const NAMES = ['九转大肠','葱烧海参','爆炒腰花','德州扒鸡','把子肉','四喜丸子',
               '糖醋黄河鲤鱼','油闷大虾','奶汤蒲菜','五香熏鱼','鲁味酱牛肉','山东大煎饼','拔丝山药'];
const BASE = '../../';
const OW = 1792, OH = 1344;
const W = 896, H = 672;              // 2 倍于前次分析,精度更高
const cv = document.createElement('canvas');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d', { willReadFrequently: true });

const load = (n) => new Promise((r) => {
  const i = new Image();
  i.onload = () => r(i);
  i.onerror = () => r(null);
  i.src = BASE + encodeURIComponent(n) + '.png';
});

(async () => {
  const grads = [];
  const rgbs = [];
  for (const n of NAMES) {
    const img = await load(n);
    if (!img) continue;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);
    const d = ctx.getImageData(0, 0, W, H).data;
    rgbs.push(new Uint8ClampedArray(d));
    const lum = new Float32Array(W * H);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      lum[p] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
    }
    const g = new Float32Array(W * H);
    for (let y = 1; y < H - 1; y++)
      for (let x = 1; x < W - 1; x++) {
        const p = y * W + x;
        const gx = lum[p + 1] - lum[p - 1];
        const gy = lum[p + W] - lum[p - W];
        g[p] = Math.sqrt(gx * gx + gy * gy);
      }
    grads.push(g);
  }

  const N = grads.length;
  const med = new Float32Array(W * H);
  const tmp = new Float64Array(N);
  for (let p = 0; p < W * H; p++) {
    for (let k = 0; k < N; k++) tmp[k] = grads[k][p];
    tmp.sort();
    med[p] = N % 2 ? tmp[(N - 1) / 2] : (tmp[N / 2 - 1] + tmp[N / 2]) / 2;
  }

  // 逐通道中位数(RGB),用于彩度判别
  const medRGB = new Uint8ClampedArray(W * H * 4);
  const ch3 = [new Float64Array(N), new Float64Array(N), new Float64Array(N)];
  for (let p = 0; p < W * H; p++) {
    for (let k = 0; k < N; k++) {
      const j = p * 4;
      ch3[0][k] = rgbs[k][j]; ch3[1][k] = rgbs[k][j + 1]; ch3[2][k] = rgbs[k][j + 2];
    }
    for (let c = 0; c < 3; c++) {
      ch3[c].sort();
      medRGB[p * 4 + c] = N % 2 ? ch3[c][(N - 1) / 2] : (ch3[c][N / 2 - 1] + ch3[c][N / 2]) / 2;
    }
    medRGB[p * 4 + 3] = 255;
  }

  const L = [];
  L.push('载入 ' + N + ' 张,分析尺寸 ' + W + 'x' + H + '(原图 ' + OW + 'x' + OH + ')');
  const sx = OW / W, sy = OH / H;

  // 只在右下角找
  const x0 = Math.floor(1400 / sx), x1 = W;
  const y0 = Math.floor(1140 / sy), y1 = H;
  const cw = 2, ch = 2;                     // 每格 2 分析像素 = 4 原图像素
  const cols = Math.floor((x1 - x0) / cw), rows = Math.floor((y1 - y0) / ch);

  const cell = [];
  let mx = 0;
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) {
      let s = 0, n = 0;
      for (let y = y0 + r * ch; y < y0 + (r + 1) * ch; y++)
        for (let x = x0 + c * cw; x < x0 + (c + 1) * cw; x++) { s += med[y * W + x]; n++; }
      const v = n ? s / n : 0;
      row.push(v); if (v > mx) mx = v;
    }
    cell.push(row);
  }

  const ramp = ' .:-=+*#%@';
  L.push('');
  L.push('梯度中位数图 · 右下角');
  L.push('每格 = 原始 4x4 像素;横轴 ' + 1400 + '→' + OW + ',纵轴 ' + 1140 + '→' + OH);
  const ruler = Array.from({ length: cols }, (_, i) => (i % 10 === 0 ? String((1400 + i * 4 / 100) % 10 | 0) : ' ')).join('');
  L.push('     ' + ruler);
  cell.forEach((row, r) => {
    let line = '';
    row.forEach((v) => { line += ramp[Math.min(9, Math.round((v / (mx || 1)) * 9))]; });
    const oy = 1140 + r * ch * sy;
    L.push(String(Math.round(oy)).padStart(5) + line);
  });
  L.push('     ' + ruler);
  L.push('峰值 ' + mx.toFixed(4));

  // 找最大连通高值区
  const thr = mx * 0.30;
  const seen = new Uint8Array(cols * rows);
  let best = null;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c;
    if (seen[i] || cell[r][c] < thr) continue;
    const stack = [[r, c]]; seen[i] = 1;
    let n = 0, a = 1e9, b = 1e9, cc = -1, d2 = -1, sum = 0;
    while (stack.length) {
      const [y, x] = stack.pop(); n++; sum += cell[y][x];
      if (x < a) a = x; if (y < b) b = y;
      if (x > cc) cc = x; if (y > d2) d2 = y;
      for (const [dy, dx] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const ny = y + dy, nx = x + dx;
        if (ny < 0 || nx < 0 || ny >= rows || nx >= cols) continue;
        const j = ny * cols + nx;
        if (!seen[j] && cell[ny][nx] >= thr) { seen[j] = 1; stack.push([ny, nx]); }
      }
    }
    if (!best || n > best.n) best = { n, a, b, cc, d2, sum };
  }

  L.push('');
  if (best) {
    const ox0 = Math.round(1400 + best.a * cw * sx), ox1 = Math.round(1400 + (best.cc + 1) * cw * sx);
    const oy0 = Math.round(1080 + best.b * ch * sy), oy1 = Math.round(1080 + (best.d2 + 1) * ch * sy);
    L.push('最大连通区 ' + best.n + ' 格,平均梯度 ' + (best.sum / best.n).toFixed(4));
    L.push('原图坐标 x ' + ox0 + ' → ' + ox1 + '   y ' + oy0 + ' → ' + oy1 +
           '   (' + (ox1 - ox0) + ' x ' + (oy1 - oy0) + ')');
    L.push('距右边 ' + (OW - ox1) + 'px   距下边 ' + (OH - oy1) + 'px');
  }

  /* 判别:水印是半透明覆盖 -> 低彩度;食物内容彩度高 */
  const regions = {
    '上簇 A x1520-1640 y1180-1235': [1520, 1180, 1640, 1235],
    '下条 B x1550-1760 y1262-1325': [1550, 1262, 1760, 1325],
    '对照 背景 x1100-1400 y1150-1330': [1100, 1150, 1400, 1330],
    '对照 盘心 x800-1100 y600-850': [800, 600, 1100, 850],
  };
  L.push('');
  L.push('=== 中位数图的彩度判别(彩度低 = 更像半透明覆盖) ===');
  for (const [name, [ax0, ay0, ax1, ay1]] of Object.entries(regions)) {
    let lum = 0, sat = 0, n = 0;
    for (let y = Math.floor(ay0 / sy); y < Math.floor(ay1 / sy); y++)
      for (let x = Math.floor(ax0 / sx); x < Math.floor(ax1 / sx); x++) {
        const i = (y * W + x) * 4;
        const r = medRGB[i], g = medRGB[i + 1], b = medRGB[i + 2];
        lum += (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        sat += (mx - mn) / 255;
        n++;
      }
    L.push(name.padEnd(34) + ' 亮度 ' + (lum / n).toFixed(3) + '  彩度 ' + (sat / n).toFixed(3));
  }
  document.getElementById('out').textContent = L.join('\n');
})();
</script>
</body>
</html>
